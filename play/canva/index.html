<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f7f2">
  <meta name="robots" content="noindex">
  <title>Slides — Canva</title>
  <link rel="icon" href="../../assets/css-logo.png">
  <style>
    @font-face{font-family:Pixelify;src:url('../../assets/fonts/pixelify-400.ttf') format('truetype');font-weight:400;font-display:swap}
    @font-face{font-family:Pixelify;src:url('../../assets/fonts/pixelify-600.ttf') format('truetype');font-weight:600;font-display:swap}
    @font-face{font-family:DM;src:url('../../assets/fonts/dm-sans-400.ttf') format('truetype');font-weight:400;font-display:swap}
    @font-face{font-family:DM;src:url('../../assets/fonts/dm-sans-600.ttf') format('truetype');font-weight:600;font-display:swap}
    :root{--paper:#f8f7f2;--card:#fbfaf6;--ink:#303044;--purple:#7070a2;--lavender:#b3aee0;--shadow:#d6d4e2;--mint:#98e7ad;--pink:#f1a1db;--muted:#55536a;--s:1;color-scheme:light}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#1d1c27}
    h1,p{margin:0}
    .stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform:translate(-50%,-50%) scale(var(--s))}
    .slide{position:absolute;inset:0;overflow:hidden;color:var(--ink);font:400 30px/1.4 DM,Arial,sans-serif;background-color:var(--paper);background-image:linear-gradient(rgba(112,112,162,.09) 2px,transparent 2px),linear-gradient(90deg,rgba(112,112,162,.09) 2px,transparent 2px);background-size:48px 48px}
    h1{font-family:Pixelify,monospace;font-weight:600;color:var(--ink)}
    h1 em{font-style:normal;color:var(--purple)}
    .eyebrow{font:600 28px DM,Arial,sans-serif;letter-spacing:5px;color:var(--purple)}

    .window{position:absolute;left:50%;top:50%;width:1180px;transform:translate(-50%,-50%) rotate(-1deg);border:4px solid var(--ink);background:var(--card);box-shadow:16px 16px 0 var(--shadow)}
    .bar{display:flex;align-items:center;justify-content:space-between;height:60px;padding:0 22px 0 26px;background:var(--purple);color:#f2f0fb;font:400 30px Pixelify,monospace}
    .lights{display:flex;gap:12px}
    .lights i{display:block;width:18px;height:18px;background:#d9d6f2}
    .body{padding:64px 80px 70px}
    h1{font-size:112px;line-height:1;letter-spacing:-1px;margin:26px 0 20px}
    .lede{font-size:34px;color:var(--muted)}
    .go{display:inline-flex;align-items:center;gap:18px;margin-top:52px;padding:26px 44px;background:var(--mint);border:4px solid var(--ink);box-shadow:10px 10px 0 var(--shadow);font:400 50px Pixelify,monospace;color:var(--ink);text-decoration:none;transition:transform .1s,box-shadow .1s}
    .go:hover,.go:focus-visible{background:#b2efc2;outline:none}
    .go:active{transform:translate(8px,8px);box-shadow:2px 2px 0 var(--shadow)}
    .hint{margin-top:34px;font:400 26px Pixelify,monospace;letter-spacing:1px;color:var(--purple)}
    .hint b{font-weight:400;color:var(--ink)}

    .asterisk{position:absolute;fill:none;stroke-width:17;pointer-events:none}
    .asterisk.mint{left:1640px;top:120px;width:130px;height:130px;stroke:var(--mint);animation:spin 18s linear infinite}
    .asterisk.pink{left:210px;top:820px;width:80px;height:80px;stroke:var(--pink);animation:spin 12s linear infinite reverse}
    @keyframes spin{to{rotate:360deg}}
    .rise{animation:rise .6s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--d,0) * 120ms)}
    @keyframes rise{from{opacity:0;transform:translateY(40px)}}
    @media (prefers-reduced-motion:reduce){.asterisk,.rise{animation:none}}
  </style>
</head>
<body>
  <main class="stage" id="stage">
    <section class="slide" aria-label="Open the Canva slides">
      <svg class="asterisk mint" viewBox="0 0 100 100" aria-hidden="true"><path d="M50 4v92M4 50h92M17.5 17.5l65 65M82.5 17.5l-65 65"/></svg>
      <svg class="asterisk pink" viewBox="0 0 100 100" aria-hidden="true"><path d="M50 4v92M4 50h92M17.5 17.5l65 65M82.5 17.5l-65 65"/></svg>
      <div class="window">
        <div class="bar"><span>slides.exe</span><span class="lights" aria-hidden="true"><i></i><i></i><i></i></span></div>
        <div class="body">
          <p class="eyebrow rise">NEXT UP</p>
          <h1 class="rise" style="--d:1">Our <em>slides.</em></h1>
          <p class="lede rise" style="--d:2">Open the Canva slides, then come back here for Jeopardy.</p>
          <a class="go rise" style="--d:3" id="go" href="https://www.canva.com/design/DAHYDSKdHe4/LDg7LdZV_Ouoa7T59RYR9w/edit" target="_blank" rel="noopener noreferrer">Open Canva →</a>
          <p class="hint rise" style="--d:4"><b>Enter</b> opens it in a new tab · <b>→</b> goes on to Jeopardy · <b>←</b> goes back</p>
        </div>
      </div>
    </section>
  </main>

  <script>
    // Fit the 1920x1080 board to the window. Enter opens the link at once; arrows and F go to the Play deck.
    (function () {
      var stage = document.getElementById('stage');
      var go = document.getElementById('go');
      var framed = window.parent !== window;
      function fit() { stage.style.setProperty('--s', String(Math.max(0.1, Math.min(innerWidth / 1920, innerHeight / 1080)))); }
      addEventListener('resize', fit);
      fit();

      // Keep the link focused so Enter works as soon as you arrive, with no click needed.
      function focusLink() { go.focus({ preventScroll: true }); }
      addEventListener('focus', focusLink);
      focusLink();

      document.addEventListener('keydown', function (e) {
        if (e.metaKey || e.ctrlKey || e.altKey) return;
        var k = e.key;
        if (framed && (k === 'ArrowRight' || k === 'PageDown')) parent.postMessage({ type: 'play-nav', dir: 1 }, '*');
        else if (framed && (k === 'ArrowLeft' || k === 'PageUp')) parent.postMessage({ type: 'play-nav', dir: -1 }, '*');
        else if (k === 'f' || k === 'F') {
          if (framed) { parent.postMessage({ type: 'play-fullscreen' }, '*'); return; }
          try { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); } catch (x) {}
        } else if (k === ' ') { e.preventDefault(); go.click(); }
      });
    })();
  </script>
</body>
</html>
